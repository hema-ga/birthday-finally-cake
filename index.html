<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>happy birthday bitch 🎂</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2eaff;color:#59378c;font-family:"Trebuchet MS",sans-serif;text-align:center}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(900px,96vw);background:#fff8ff;border:4px solid #8056b8;border-radius:28px;padding:24px;box-shadow:10px 10px #cdb4f1}
h1{font-size:clamp(32px,6vw,64px);margin:4px;color:#8056b8}h1 span,.old span{color:#f06ca9}
.sub{font-weight:800;margin-bottom:10px}
.cake{position:relative;width:min(520px,88vw);height:350px;margin:8px auto}
.plate{position:absolute;bottom:20px;left:5%;width:90%;height:28px;border-radius:50%;background:#fff;border:3px solid #8056b8}
.tier{position:absolute;left:10%;width:80%;border-radius:18px;background:#b92735;border:4px solid #7e1d2a;box-shadow:inset 0 15px #d94a53}
.bottom{height:125px;bottom:48px}.top{height:100px;width:58%;left:21%;bottom:157px}
.icing{position:absolute;top:-7px;left:-3px;right:-3px;height:34px;background:#fff;border:4px solid #eee;border-radius:18px}
.drip{position:absolute;width:18px;height:24px;background:#fff;border-radius:0 0 12px 12px;bottom:-20px}.drip:nth-child(1){left:20%}.drip:nth-child(2){left:48%}.drip:nth-child(3){left:72%}
.candles{position:absolute;bottom:255px;left:17%;right:17%;display:flex;justify-content:space-around;align-items:flex-end}
.candle{width:15px;height:58px;border-radius:6px;background:#ef71ae;border:3px solid #a83d82;position:relative;transition:opacity .4s,transform .4s}
.candle:nth-child(even){background:#a76bea;border-color:#7040ae}
.flame{position:absolute;left:50%;top:-25px;width:15px;height:22px;background:#ffd85c;border-radius:50% 50% 50% 10%;transform:translateX(-50%) rotate(45deg);box-shadow:0 0 12px #ffb83d;transition:transform .08s,opacity .25s}
.candle.blown .flame{opacity:0;transform:translateX(-50%) scale(.2) rotate(45deg)}
.candle.blown{transform:translateY(2px)}
.smoke{position:absolute;left:50%;top:-30px;width:5px;height:18px;border-radius:50%;background:#aaa;opacity:0;transform:translateX(-50%)}
.candle.blown .smoke{animation:smoke 1.1s ease-out forwards}
@keyframes smoke{0%{opacity:.65;transform:translate(-50%,0) scale(.8)}100%{opacity:0;transform:translate(-50%,-30px) scale(1.8)}}
.controls{margin:12px}button{padding:12px 18px;border:3px solid #8056b8;border-radius:14px;background:#fff;color:#8056b8;font-weight:900;cursor:pointer;box-shadow:4px 4px #cdb4f1}button:disabled{opacity:.6;cursor:default}
#status{margin:12px;font-weight:800;min-height:24px}.hidden{display:none}
.old{font-size:clamp(38px,7vw,70px);line-height:.95}
.photos{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:24px auto;max-width:820px}
.photo{background:white;border:3px solid #8056b8;padding:7px;box-shadow:4px 5px #cdb4f1}.photo:nth-child(1){transform:rotate(-5deg)}.photo:nth-child(2){transform:rotate(3deg)}.photo:nth-child(3){transform:rotate(-2deg)}.photo:nth-child(4){transform:rotate(5deg)}.photo:nth-child(5){transform:rotate(-4deg)}.photo img{width:100%;aspect-ratio:1/1;object-fit:cover}.photo small{display:block;margin-top:5px;font-weight:900}
.song-note{padding:14px;border:3px dashed #c09ae9;border-radius:16px;font-weight:800}
@media(max-width:650px){.photos{grid-template-columns:repeat(2,1fr)}.photo:nth-child(5){grid-column:1/-1;width:48%;justify-self:center}.cake{height:310px}.candles{bottom:235px}}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<section id="before">
<h1>happy birthday <span>bitch</span></h1>
<div class="sub">blow the candles and make a wish ✨</div>
<div class="cake">
  <div class="plate"></div>
  <div class="tier bottom"><div class="icing"><i class="drip"></i><i class="drip"></i><i class="drip"></i></div></div>
  <div class="tier top"><div class="icing"><i class="drip"></i><i class="drip"></i><i class="drip"></i></div></div>
  <div id="candles" class="candles"></div>
</div>
<div class="controls"><button id="start">🎤 Start birthday surprise</button><div id="status">click once, allow the mic, then blow toward the laptop 🎂💨</div></div>
</section>
<section id="after" class="hidden">
<div class="old">ur so old<br><span>verrryyyyy old</span></div>
<div class="photos">
<div class="photo"><img src="photo1.jpg" alt="birthday memory 1"><small>tiny menace ♡</small></div>
<div class="photo"><img src="photo2.jpg" alt="birthday memory 2"><small>the model era ✦</small></div>
<div class="photo"><img src="photo3.jpg" alt="birthday memory 3"><small>purple supremacy 💜</small></div>
<div class="photo"><img src="photo4.jpg" alt="birthday memory 4"><small>no comment.</small></div>
<div class="photo"><img src="photo5.jpg" alt="birthday memory 5"><small>evidence 🫵</small></div>
</div>
<div class="song-note">🎶 happpyyyy biiiiirthday to yooooouuu~<br>happpyyyy biiiiirthday deeeaar biiitch~ 🎤</div><br>
<button onclick="location.reload()">🔄 replay the humiliation</button>
</section>
</main></div>
<script>
const N=8;
const candlesBox=document.getElementById('candles');
const statusEl=document.getElementById('status');
const startBtn=document.getElementById('start');
const audio=new Audio('birthday-song.mp3');
audio.preload='auto';
audio.loop=false;

for(let i=0;i<N;i++){
  const c=document.createElement('div');
  c.className='candle';
  c.innerHTML='<div class="flame"></div><div class="smoke"></div>';
  candlesBox.appendChild(c);
}

let stream=null,audioCtx=null,analyser=null,data=null,raf=null,blowStart=0,started=false,ambient=0;

function rms(){
  analyser.getByteTimeDomainData(data);
  let sum=0;
  for(const v of data){const x=(v-128)/128;sum+=x*x;}
  return Math.sqrt(sum/data.length);
}

function spectralEnergy(){
  const bins=new Float32Array(analyser.frequencyBinCount);
  analyser.getFloatFrequencyData(bins);
  let sum=0,count=0;
  for(let i=3;i<Math.min(70,bins.length);i++){
    if(bins[i]>-90){sum+=Math.pow(10,bins[i]/20);count++;}
  }
  return count?sum/count:0;
}

function blowThreshold(){
  // Adaptive threshold: loud laptop mics need a stronger blow, quiet mics stay sensitive.
  return Math.max(0.020, ambient*1.05 + 0.005);
}

function animateFlames(r,threshold){
  const strength=Math.min(1.8,Math.max(1,r/threshold));
  document.querySelectorAll('.flame').forEach(f=>{
    if(r>threshold*.72) f.style.transform=`translateX(-50%) rotate(${20-25*Math.min(1,strength-0.7)}deg) scale(${1+0.3*Math.min(1,strength-0.7)})`;
    else f.style.transform='translateX(-50%) rotate(45deg)';
  });
}

async function start(){
  if(started)return;
  started=true;
  startBtn.disabled=true;
  statusEl.textContent='asking for microphone access… 🎤';
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('Microphone API unavailable. Use GitHub Pages HTTPS.');
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    await audioCtx.resume();
    const source=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=2048;
    analyser.smoothingTimeConstant=0.15;
    source.connect(analyser);
    data=new Uint8Array(analyser.fftSize);

    // Let the analyser learn the room/laptop's normal noise before accepting a blow.
    statusEl.textContent='MIC ON 🎤 stay quiet for a second…';
    let samples=[];
    const calibrationEnd=performance.now()+900;
    function calibrate(){
      const r=rms();samples.push(r);
      if(performance.now()<calibrationEnd){requestAnimationFrame(calibrate);return;}
      samples.sort((a,b)=>a-b);
      ambient=samples[Math.floor(samples.length*.6)]||.01;
      statusEl.textContent='MIC ON 🎤 NOW BLOW HARD at the candles!';
      audio.play().then(()=>{statusEl.textContent='🎶 song playing — NOW BLOW HARD! 💨';}).catch(()=>{statusEl.textContent='🎶 click was needed for the song — NOW BLOW HARD! 💨';});
      detect();
    }
    calibrate();
  }catch(err){
    console.error(err);
    started=false;startBtn.disabled=false;
    statusEl.textContent='Mic blocked. Allow microphone access, then press the button again. 🎤';
  }
}

function detect(){
  const r=rms();
  const threshold=blowThreshold();
  // Use both amplitude and broad high-frequency activity; this avoids triggering from silence.
  const hf=spectralEnergy();
  const strongEnough=r>threshold;
  const windLike=hf>0.0007;
  animateFlames(r,threshold);
  if(strongEnough && windLike){
    if(!blowStart)blowStart=performance.now();
    if(performance.now()-blowStart>=50){blowOutCandles();return;}
  }else{
    blowStart=0;
  }
  raf=requestAnimationFrame(detect);
}

function blowOutCandles(){
  cancelAnimationFrame(raf);
  audio.pause();
  audio.currentTime=0;
  document.querySelectorAll('.candle').forEach((c,i)=>setTimeout(()=>c.classList.add('blown'),i*90));
  statusEl.textContent='💨 WHOOSH! Candles out! Make your wish! ✨';
  setTimeout(()=>{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    if(audioCtx)audioCtx.close();
    document.getElementById('before').classList.add('hidden');
    document.getElementById('after').classList.remove('hidden');
  },1200);
}
startBtn.addEventListener('click',start);
</script>
</body></html>
