<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Bitch 🎂</title>
<style>
body{margin:0;background:#f2eaff;color:#59378c;font-family:Trebuchet MS,sans-serif;text-align:center}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(900px,96vw);background:#fff8ff;border:4px solid #8056b8;border-radius:28px;padding:24px;box-shadow:10px 10px #cdb4f1}
h1{font-size:clamp(32px,6vw,64px);margin:4px;color:#8056b8}h1 span,.old span{color:#f06ca9}
.sub{font-weight:800}
.cake{position:relative;width:min(520px,88vw);height:350px;margin:10px auto}
.plate{position:absolute;bottom:20px;left:5%;width:90%;height:28px;border-radius:50%;background:#fff;border:3px solid #8056b8}
.tier{position:absolute;left:10%;width:80%;border-radius:18px;background:#b92735;border:4px solid #7e1d2a;box-shadow:inset 0 15px #d94a53}
.bottom{height:125px;bottom:48px}.top{height:100px;width:58%;left:21%;bottom:157px}
.icing{position:absolute;top:-7px;left:-3px;right:-3px;height:34px;background:#fff;border:4px solid #eee;border-radius:18px}
.drip{position:absolute;width:18px;height:24px;background:#fff;border-radius:0 0 12px 12px;bottom:-20px}
.drip:nth-child(1){left:20%}.drip:nth-child(2){left:48%}.drip:nth-child(3){left:72%}
.candles{position:absolute;bottom:255px;left:17%;right:17%;display:flex;justify-content:space-around}
.candle{width:15px;height:58px;border-radius:6px;background:#ef71ae;border:3px solid #a83d82;position:relative}
.candle:nth-child(even){background:#a76bea;border-color:#7040ae}
.flame{position:absolute;left:50%;top:-25px;width:15px;height:22px;background:#ffd85c;border-radius:50% 50% 50% 10%;transform:translateX(-50%) rotate(45deg);box-shadow:0 0 12px #ffb83d}
.out .flame{display:none}
button{padding:12px 18px;border:3px solid #8056b8;border-radius:14px;background:#fff;color:#8056b8;font-weight:900;cursor:pointer;box-shadow:4px 4px #cdb4f1}
.hidden{display:none}.old{font-size:clamp(38px,7vw,70px);line-height:.95}
.photos{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:24px auto;max-width:820px}
.photo{background:white;border:3px solid #8056b8;padding:7px;box-shadow:4px 5px #cdb4f1}
.photo img{width:100%;aspect-ratio:1/1;object-fit:cover}
.photo:nth-child(1){transform:rotate(-5deg)}.photo:nth-child(2){transform:rotate(3deg)}
.photo:nth-child(3){transform:rotate(-2deg)}.photo:nth-child(4){transform:rotate(5deg)}.photo:nth-child(5){transform:rotate(-4deg)}
@media(max-width:650px){.photos{grid-template-columns:repeat(2,1fr)}.cake{height:310px}.candles{bottom:235px}}
</style>
</head>
<body>
<audio id="bgm" src="birthday-song.mp3" preload="auto"></audio>
<div class="wrap"><main class="card">
<section id="before">
<h1>happy birthday <span>bitch</span></h1>
<div class="sub">blow the candles and make a wish ✨</div>
<div class="cake"><div class="plate"></div>
<div class="tier bottom"><div class="icing"><i class="drip"></i><i class="drip"></i><i class="drip"></i></div></div>
<div class="tier top"><div class="icing"><i class="drip"></i><i class="drip"></i><i class="drip"></i></div></div>
<div id="candles" class="candles"></div></div>
<p id="status">click start, allow the mic, then blow toward the laptop 🎤💨</p>
<button id="start">🕯️ Start the candles</button>
</section>
<section id="after" class="hidden">
<div class="old">ur so old<br><span>verrryyyyy old</span></div>
<div class="photos">
<div class="photo"><img src="photo1.jpg"><small>baby menace ♡</small></div>
<div class="photo"><img src="photo2.jpg"><small>the model era ✦</small></div>
<div class="photo"><img src="photo3.jpg"><small>purple supremacy 💜</small></div>
<div class="photo"><img src="photo4.jpg"><small>no comment.</small></div>
<div class="photo"><img src="photo5.jpg"><small>evidence 🫵</small></div>
</div>
<p>🎶 happpyyyy biiiiirthday to yooooouuu~<br>happpyyyy biiiiirthday deeeaar biiitch~ 🎤</p>
</section>
</main></div>
<script>
const N=8,c=document.getElementById('candles'),status=document.getElementById('status');
const bgm=document.getElementById('bgm');
for(let i=0;i<N;i++){let x=document.createElement('div');x.className='candle';x.innerHTML='<div class="flame"></div>';c.appendChild(x)}
let stream,ctx,an,data,raf,base=.01,blow=0;
async function start(){
  try{
    // Browsers generally block unmuted autoplay, so this first click starts the song
    // and also unlocks microphone access. After that the song continues while she blows.
    bgm.currentTime=0;
    bgm.play().catch(()=>{});
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    await ctx.resume();
    let s=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.25;
    s.connect(an);data=new Uint8Array(an.fftSize);status.textContent='MIC ON 🎤 NOW BLOW!';detect()
  }catch(e){status.textContent='microphone access was blocked — allow it and try again 🥲'}
}
function rms(){an.getByteTimeDomainData(data);let q=0;for(let v of data){v=(v-128)/128;q+=v*v}return Math.sqrt(q/data.length)}
function detect(){
  let r=rms();base=base*.985+r*.015;let th=Math.max(.025,base*1.8);
  document.querySelectorAll('.flame').forEach(f=>f.style.transform=r>th?'translateX(-50%) scale(1.35) rotate(20deg)':'translateX(-50%) rotate(45deg)');
  if(r>th){if(!blow)blow=performance.now();if(performance.now()-blow>110){out();return}}else blow=0;
  raf=requestAnimationFrame(detect)
}
function out(){
  cancelAnimationFrame(raf);
  document.querySelectorAll('.candle').forEach((x,i)=>setTimeout(()=>x.classList.add('out'),i*90));
  setTimeout(()=>{stream&&stream.getTracks().forEach(t=>t.stop());document.getElementById('before').classList.add('hidden');document.getElementById('after').classList.remove('hidden')},1200)
}
document.getElementById('start').onclick=start;
</script>
</body></html>
